spring.application.name=synctempo-api

# Sobrescreva estas variaveis em um arquivo .env local ou na configuracao da IDE.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/synctempo}
spring.datasource.username=${DATABASE_USERNAME:synctempo}
spring.datasource.password=${DATABASE_PASSWORD}

# O banco e criado exclusivamente pelas migrations versionadas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
spring.jackson.time-zone=America/Sao_Paulo

# Chave de assinatura obrigatoria, fornecida pelo ambiente em Base64 (32 bytes ou mais).
app.security.jwt.secret-base64=${JWT_SECRET_BASE64}
app.security.jwt.issuer=${JWT_ISSUER:synctempo-api}
app.security.jwt.audience=${JWT_AUDIENCE:synctempo-api}
app.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}

# Sem origens configuradas, o navegador nao recebe permissao CORS entre origens.
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Desative a documentacao interativa em ambientes que nao devem expo-la.
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.disable-swagger-default-url=true
